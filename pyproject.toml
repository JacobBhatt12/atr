[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrtx"
version = "0.5.0"
description = "A distributed GPU cloud with its own LLM inference engine"
requires-python = ">=3.11"
# The CLI and the cloud need only these; the engine's (torch, transformers, ...) are in requirements.txt.
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pydantic>=2.6", "pyyaml>=6"]

[project.scripts]
vrtx = "cli.vrtx:main"

[tool.setuptools.packages.find]
include = ["engine*", "gateway*", "cloud*", "cli*"]

[tool.setuptools.package-data]
"cloud.builder" = ["*.Dockerfile"]
