[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atr-mcp"
version = "0.3.0"
description = "ATR: Automation for Token Reduction. An MCP proxy that hides tool lists and shrinks tool results so your AI uses fewer tokens."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Bhatt" }]
keywords = ["mcp", "model-context-protocol", "llm", "tokens", "claude", "codex", "ai-agents", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
# ATR itself needs nothing outside the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/JacobBhatt12/atr"
Repository = "https://github.com/JacobBhatt12/atr"
Issues = "https://github.com/JacobBhatt12/atr/issues"

[project.optional-dependencies]
exact = ["tiktoken>=0.7"]                # exact token counts instead of the chars/4 estimate
docs = ["markitdown[all]>=0.1"]          # PDF / Word / PowerPoint / Excel in atr_read_file
http = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]   # `atr serve --http` and HTTP downstream servers
dev = ["pytest>=8.0"]

[project.scripts]
atr = "atr.cli:main"
atr-mcp = "atr.cli:serve_main"   # `uvx atr-mcp` starts the MCP server (what MCP registries run)

[tool.setuptools.packages.find]
include = ["atr*"]
