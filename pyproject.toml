[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atr"
version = "0.2.1"
description = "ATR: Automation for Token Reduction. An MCP proxy that hides tool schemas and compresses tool results."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# ATR itself needs nothing outside the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/JacobBhatt12/atr"

[project.optional-dependencies]
exact = ["tiktoken>=0.7"]                # exact token counts instead of the chars/4 estimate
docs = ["markitdown[all]>=0.1"]          # PDF / Word / PowerPoint / Excel in atr_read_file
http = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]   # `atr serve --http` and HTTP downstream servers
dev = ["pytest>=8.0"]

[project.scripts]
atr = "atr.cli:main"

[tool.setuptools.packages.find]
include = ["atr*"]
