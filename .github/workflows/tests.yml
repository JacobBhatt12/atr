name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # CPU-only torch is ~200 MB instead of ~2 GB for the CUDA build.
      # Installing it first means requirements.txt sees torch as already satisfied.
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install requirements
        run: pip install -r requirements.txt
      # Tests use a tiny random Qwen2 model, so no weights are downloaded.
      - name: Run tests
        run: python -m pytest tests/ -v

  # Triton kernels have no macOS build and CI has no GPU, so run them through
  # Triton's CPU interpreter (TRITON_INTERPRET=1): slow, but checks every kernel's math.
  triton-kernels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install requirements and Triton
        run: pip install -r requirements.txt triton numpy
      - name: Run kernel tests in the Triton interpreter
        env:
          TRITON_INTERPRET: "1"
        run: python -m pytest tests/test_month3_kernels.py -v
